<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#000;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            color:#fff;
            overflow:hidden;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .calculator-container{
            width:420px;
            background:#111;
            border:1px solid #333;
            border-radius:25px;
            padding:30px;
            box-shadow:0 0 30px rgba(255,255,255,0.08);
            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* =========================
           HEADER
        ========================= */

        .title{
            text-align:center;
            margin-bottom:25px;
        }

        .title h1{
            font-size:34px;
            letter-spacing:1px;
        }

        .title p{
            color:#888;
            margin-top:8px;
            font-size:14px;
        }

        /* =========================
           DISPLAY
        ========================= */

        .display{
            width:100%;
            height:90px;
            background:#000;
            border:1px solid #333;
            border-radius:18px;
            margin-bottom:25px;
            padding:20px;
            text-align:right;
            overflow-x:auto;
        }

        #screen{
            font-size:38px;
            font-weight:bold;
            color:#fff;
            word-wrap:break-word;
        }

        /* =========================
           BUTTON GRID
        ========================= */

        .buttons{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:15px;
        }

        button{
            height:70px;
            border:none;
            border-radius:15px;
            background:#000;
            color:#fff;
            font-size:24px;
            cursor:pointer;
            transition:0.3s;
            border:1px solid #333;
        }

        button:hover{
            background:#fff;
            color:#000;
            transform:scale(1.05);
        }

        /* =========================
           OPERATOR BUTTONS
        ========================= */

        .operator{
            background:#222;
        }

        .equal{
            background:#fff;
            color:#000;
            font-weight:bold;
        }

        .equal:hover{
            background:#999;
            color:#000;
        }

        .clear{
            background:#444;
        }

        /* =========================
           FEATURES
        ========================= */

        .features{
            margin-top:25px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
        }

        .feature-card{
            background:#000;
            border:1px solid #333;
            border-radius:12px;
            padding:12px;
            text-align:center;
            color:#aaa;
            font-size:13px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer{
            margin-top:20px;
            text-align:center;
            color:#666;
            font-size:12px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:500px){

            .calculator-container{
                width:95%;
                padding:20px;
            }

            button{
                height:60px;
                font-size:20px;
            }

            #screen{
                font-size:30px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         CALCULATOR
    ========================= -->

    <div class="calculator-container">

        <!-- Header -->

        <div class="title">

            <h1>Smart Calculator</h1>

            <p>
                Professional Black & White Scientific UI
            </p>

        </div>

        <!-- Display -->

        <div class="display">

            <div id="screen">0</div>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button class="clear" onclick="clearScreen()">C</button>

            <button class="operator" onclick="deleteLast()">⌫</button>

            <button class="operator" onclick="appendValue('%')">%</button>

            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>

            <button onclick="appendValue('8')">8</button>

            <button onclick="appendValue('9')">9</button>

            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>

            <button onclick="appendValue('5')">5</button>

            <button onclick="appendValue('6')">6</button>

            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>

            <button onclick="appendValue('2')">2</button>

            <button onclick="appendValue('3')">3</button>

            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('00')">00</button>

            <button onclick="appendValue('0')">0</button>

            <button onclick="appendValue('.')">.</button>

            <button class="equal" onclick="calculate()">=</button>

        </div>

        <!-- Features -->

        <div class="features">

            <div class="feature-card">
                Smart Validation
            </div>

            <div class="feature-card">
                Precision Algorithm
            </div>

            <div class="feature-card">
                Responsive Grid UI
            </div>

            <div class="feature-card">
                Real-Time Calculation
            </div>

        </div>

        <!-- Footer -->

        <div class="footer">
            AI Ready Calculator System | 2026 Edition
        </div>

    </div>

    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        let screen = document.getElementById("screen");

        let expression = "";

        /* =========================
           APPEND VALUE
        ========================= */

        function appendValue(value){

            // Prevent multiple operators

            let operators = ['+', '-', '*', '/', '%'];

            let lastChar = expression.slice(-1);

            if(
                operators.includes(lastChar) &&
                operators.includes(value)
            ){
                return;
            }

            // Prevent multiple decimals

            if(value === '.'){

                let parts = expression.split(/[\+\-\*\/%]/);

                let currentPart = parts[parts.length - 1];

                if(currentPart.includes('.')){
                    return;
                }
            }

            expression += value;

            screen.innerHTML = expression;
        }

        /* =========================
           CLEAR SCREEN
        ========================= */

        function clearScreen(){

            expression = "";

            screen.innerHTML = "0";
        }

        /* =========================
           DELETE LAST CHARACTER
        ========================= */

        function deleteLast(){

            expression = expression.slice(0, -1);

            if(expression === ""){

                screen.innerHTML = "0";
            }

            else{

                screen.innerHTML = expression;
            }
        }

        /* =========================
           CALCULATE RESULT
        ========================= */

        function calculate(){

            try{

                // Validation Algorithm

                if(expression === ""){

                    screen.innerHTML = "0";

                    return;
                }

                // Prevent ending operator

                let lastChar = expression.slice(-1);

                let operators = ['+', '-', '*', '/', '%'];

                if(operators.includes(lastChar)){

                    screen.innerHTML = "Error";

                    return;
                }

                // Safe Evaluation

                let result = eval(expression);

                // Precision Algorithm

                result = parseFloat(result.toFixed(10));

                screen.innerHTML = result;

                expression = result.toString();

            }

            catch(error){

                screen.innerHTML = "Error";

                expression = "";
            }
        }

        /* =========================
           KEYBOARD SUPPORT
        ========================= */

        document.addEventListener("keydown", function(event){

            let key = event.key;

            // Numbers

            if(
                !isNaN(key) ||
                ['+', '-', '*', '/', '.', '%'].includes(key)
            ){

                appendValue(key);
            }

            // Enter

            else if(key === "Enter"){

                calculate();
            }

            // Backspace

            else if(key === "Backspace"){

                deleteLast();
            }

            // Escape

            else if(key === "Escape"){

                clearScreen();
            }
        });

    </script>

</body>

</html>
